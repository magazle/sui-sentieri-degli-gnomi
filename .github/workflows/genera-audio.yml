name: Genera voci dei personaggi

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Rigenera tutte le battute"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Genera audio con ElevenLabs
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: node scripts/genera-audio.mjs ${{ inputs.force && '--force' || '' }}
      - name: Salva gli audio nel repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/audio/it
          git diff --cached --quiet || git commit -m "Audio dei personaggi aggiornati"
          git push
